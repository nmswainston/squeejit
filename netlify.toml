[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.12.0. Netlify's default is older than that,
  # so without this pin the build fails at "npm run build" with an engine
  # error. "22" resolves to the latest 22.x, which satisfies the minimum.
  NODE_VERSION = "22"
